[project]
name = "ai-tauron"
version = "0.1.0"
description = "AI-TAURON"
requires-python = ">=3.11"
dependencies = [
    # Pure-Python core — no native build requirements
    "pydantic>=2.0",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
# API layer (pure-Python wheels)
api = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.18",
]
# Persistence (C extensions — need binary wheels or build tools)
db = [
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
]
# Heavy ML/document-processing stack — requires native build tools in some envs.
# Install for production: pip install -e ".[ml]"
ml = [
    "llama-index>=0.12",
    "llama-index-vector-stores-qdrant>=0.4",
    "llama-index-llms-ollama>=0.5",
    "llama-index-embeddings-huggingface>=0.5",
    "mlflow>=2.18",
    "qdrant-client>=1.12",
    "docling>=2.14",
    "pdfplumber>=0.11",
    "sentence-transformers>=3.3",
    "langfuse>=2.50",
]
# Minimal deps for CI unit tests — pure-Python only, no native build requirements.
test = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.28",
]
dev = [
    "ai-tauron[api,db,ml,test]",
]
ui = [
    "streamlit>=1.40",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "integration: requires running infrastructure services",
    "e2e: end-to-end API tests",
]
