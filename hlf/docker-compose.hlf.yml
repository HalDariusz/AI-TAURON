version: '3.8'

# Hyperledger Fabric MVP network for AI-TAURON
# Minimal topology: 1 peer, 1 orderer, 1 CA, 1 CouchDB, REST proxy

volumes:
  orderer_data:
  peer_data:
  couchdb_data:

networks:
  hlf_net:
    name: hlf_net

services:
  # --- Certificate Authority ---
  ca.tauron.example.com:
    image: hyperledger/fabric-ca:1.5
    container_name: hlf-ca
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-tauron
      - FABRIC_CA_SERVER_TLS_ENABLED=false
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./config/fabric-ca:/etc/hyperledger/fabric-ca-server
    networks:
      - hlf_net

  # --- Orderer ---
  orderer.tauron.example.com:
    image: hyperledger/fabric-orderer:2.5
    container_name: hlf-orderer
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=false
    ports:
      - "7050:7050"
    volumes:
      - orderer_data:/var/hyperledger/production/orderer
      - ./config/orderer/msp:/var/hyperledger/orderer/msp
    networks:
      - hlf_net

  # --- CouchDB (peer state DB) ---
  couchdb.tauron.example.com:
    image: couchdb:3.3
    container_name: hlf-couchdb
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    networks:
      - hlf_net

  # --- Peer ---
  peer0.tauron.example.com:
    image: hyperledger/fabric-peer:2.5
    container_name: hlf-peer
    environment:
      - CORE_PEER_ID=peer0.tauron.example.com
      - CORE_PEER_ADDRESS=peer0.tauron.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.tauron.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.tauron.example.com:7051
      - CORE_PEER_LOCALMSPID=TauronMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=false
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.tauron.example.com:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=hlf_net
    ports:
      - "7051:7051"
    volumes:
      - peer_data:/var/hyperledger/production
      - ./config/peer/msp:/etc/hyperledger/fabric/msp
      - /var/run/docker.sock:/host/var/run/docker.sock
    depends_on:
      - couchdb.tauron.example.com
      - orderer.tauron.example.com
    networks:
      - hlf_net
