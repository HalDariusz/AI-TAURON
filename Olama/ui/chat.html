<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ollama @ HAL — czat</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --border:#e2e5ea; --text:#1c2024;
    --muted:#6b7280; --accent:#2563eb; --user:#2563eb; --user-fg:#fff;
    --bot:#eef1f5; --bot-fg:#1c2024; --err:#dc2626;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1216; --panel:#171b21; --border:#262c34; --text:#e6e9ef;
      --muted:#8b95a3; --accent:#3b82f6; --user:#2563eb; --user-fg:#fff;
      --bot:#232a33; --bot-fg:#e6e9ef; --err:#f87171;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; height:100vh;
  }
  header{
    display:flex; align-items:center; gap:12px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  header h1{font-size:15px; margin:0; font-weight:600; display:flex; align-items:center; gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;flex:none}
  .dot.ok{background:#22c55e}.dot.err{background:var(--err)}
  header select, header button{
    font:inherit; padding:6px 10px; border-radius:8px;
    border:1px solid var(--border); background:var(--bg); color:var(--text); cursor:pointer;
  }
  header .spacer{flex:1}
  header .muted{color:var(--muted); font-size:12px}
  #sysrow{
    display:none; padding:8px 16px; background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  #sysrow textarea{
    width:100%; min-height:44px; resize:vertical; font:inherit; padding:8px;
    border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);
  }
  #chat{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px}
  .msg{max-width:min(760px,92%); padding:11px 14px; border-radius:14px; white-space:pre-wrap;
       word-wrap:break-word; line-height:1.5; font-size:14.5px}
  .msg.user{align-self:flex-end; background:var(--user); color:var(--user-fg); border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start; background:var(--bot); color:var(--bot-fg); border-bottom-left-radius:4px}
  .msg.err{align-self:center; background:transparent; color:var(--err); font-size:13px; text-align:center}
  .msg pre{background:rgba(127,127,127,.15); padding:10px; border-radius:8px; overflow-x:auto; margin:6px 0}
  .msg code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px}
  .who{font-size:11px; color:var(--muted); margin:0 6px 3px; align-self:flex-start}
  .who.user{align-self:flex-end}
  footer{
    display:flex; gap:10px; padding:12px 16px; background:var(--panel);
    border-top:1px solid var(--border); align-items:flex-end;
  }
  #input{
    flex:1; font:inherit; padding:11px 12px; border-radius:12px;
    border:1px solid var(--border); background:var(--bg); color:var(--text);
    resize:none; min-height:46px; max-height:180px; line-height:1.4;
  }
  #send{
    background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:0 20px; height:46px; font:inherit; font-weight:600; cursor:pointer;
  }
  #send:disabled{opacity:.5; cursor:not-allowed}
  .hint{color:var(--muted); font-size:12.5px; text-align:center; margin:auto; max-width:520px}
  .hint code{background:rgba(127,127,127,.15); padding:1px 5px; border-radius:4px}
</style>
</head>
<body>
  <header>
    <h1><span class="dot" id="dot"></span> Ollama @ HAL</h1>
    <select id="model" title="Model"></select>
    <button id="sysBtn" title="Instrukcja systemowa (rola modelu)">⚙︎ System</button>
    <button id="clear" title="Wyczyść rozmowę">🗑 Wyczyść</button>
    <div class="spacer"></div>
    <span class="muted" id="endpoint"></span>
  </header>

  <div id="sysrow">
    <textarea id="system" placeholder="Instrukcja systemowa, np.: Jesteś zwięzłym analitykiem finansowym. Odpowiadaj po polsku."></textarea>
  </div>

  <div id="chat">
    <div class="hint" id="welcome">
      Połączono z modelami LLM na HAL. Wybierz model u góry i napisz wiadomość.<br>
      <b>Enter</b> = wyślij &nbsp;·&nbsp; <b>Shift+Enter</b> = nowa linia
    </div>
  </div>

  <footer>
    <textarea id="input" placeholder="Napisz wiadomość…" rows="1"></textarea>
    <button id="send">Wyślij</button>
  </footer>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const PORT = params.get('api') || '11434';
  const BASE = `http://127.0.0.1:${PORT}`;

  const $ = id => document.getElementById(id);
  const chat = $('chat'), input = $('input'), sendBtn = $('send'),
        modelSel = $('model'), dot = $('dot'), endpoint = $('endpoint'),
        systemBox = $('system'), sysrow = $('sysrow'), welcome = $('welcome');

  endpoint.textContent = BASE;
  let history = [];          // {role, content}
  let streaming = false;
  let controller = null;

  function setStatus(state){ dot.className = 'dot' + (state ? ' ok' : ' err'); }

  function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  // bardzo lekki rendering: bloki ``` -> <pre>, reszta jako tekst
  function render(el, text){
    const parts = text.split(/```/);
    el.innerHTML = '';
    parts.forEach((p, i) => {
      if (i % 2 === 1){
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.textContent = p.replace(/^\w*\n/, '');
        pre.appendChild(code); el.appendChild(pre);
      } else if (p){
        el.appendChild(document.createTextNode(p));
      }
    });
  }

  function addMsg(role, text){
    if (welcome) welcome.remove();
    const who = document.createElement('div');
    who.className = 'who ' + (role === 'user' ? 'user' : '');
    who.textContent = role === 'user' ? 'Ty' : (role === 'err' ? '' : 'Model');
    const el = document.createElement('div');
    el.className = 'msg ' + (role === 'user' ? 'user' : role === 'err' ? 'err' : 'bot');
    if (role === 'err'){ el.textContent = text; }
    else render(el, text);
    if (role !== 'err') chat.appendChild(who);
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  async function loadModels(){
    try{
      const r = await fetch(`${BASE}/api/tags`);
      const d = await r.json();
      setStatus(true);
      modelSel.innerHTML = '';
      (d.models || []).sort((a,b)=>a.name.localeCompare(b.name)).forEach(m => {
        const o = document.createElement('option');
        o.value = m.name; o.textContent = m.name; modelSel.appendChild(o);
      });
      // domyślnie Bielik 11B jeśli jest
      const pref = [...modelSel.options].find(o => /bielik-11b/i.test(o.value));
      if (pref) modelSel.value = pref.value;
    }catch(e){
      setStatus(false);
      addMsg('err', `Brak połączenia z Ollamą (${BASE}). Sprawdź, czy tunel działa: uruchom connect (np. ./connect.sh) i odśwież stronę.`);
    }
  }

  async function send(){
    const text = input.value.trim();
    if (!text || streaming) return;
    input.value = ''; input.style.height = 'auto';
    addMsg('user', text);
    history.push({role:'user', content:text});

    const messages = [];
    const sys = systemBox.value.trim();
    if (sys) messages.push({role:'system', content:sys});
    messages.push(...history);

    streaming = true; sendBtn.disabled = true; sendBtn.textContent = '…';
    const botEl = addMsg('bot', '');
    let acc = '';
    controller = new AbortController();
    try{
      const r = await fetch(`${BASE}/api/chat`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ model: modelSel.value, messages, stream:true }),
        signal: controller.signal
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while(true){
        const {value, done} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream:true});
        let nl;
        while((nl = buf.indexOf('\n')) >= 0){
          const line = buf.slice(0, nl).trim(); buf = buf.slice(nl+1);
          if (!line) continue;
          const j = JSON.parse(line);
          if (j.message && j.message.content){
            acc += j.message.content;
            render(botEl, acc);
            chat.scrollTop = chat.scrollHeight;
          }
        }
      }
      history.push({role:'assistant', content:acc});
    }catch(e){
      if (e.name === 'AbortError'){ history.push({role:'assistant', content:acc}); }
      else { setStatus(false); botEl.className='msg err'; botEl.textContent = 'Błąd: ' + e.message; }
    }finally{
      streaming = false; sendBtn.disabled = false; sendBtn.textContent = 'Wyślij';
      controller = null;
    }
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  });
  $('clear').addEventListener('click', () => {
    history = [];
    [...chat.querySelectorAll('.msg,.who')].forEach(n => n.remove());
    addMsg('err', 'Rozmowa wyczyszczona.');
  });
  $('sysBtn').addEventListener('click', () => {
    sysrow.style.display = sysrow.style.display === 'block' ? 'none' : 'block';
  });

  loadModels();
})();
</script>
</body>
</html>
